name: Build DailyCash KeyGen APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        if: hashFiles('KeyGen-Upload.zip') != ''
        run: unzip -o KeyGen-Upload.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put signing key in place
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '\r' | grep -E '^[A-Za-z0-9+/]+=*$' | tr -d '\n' > key.b64
          base64 -d key.b64 > dailycash_key.p12
          test -s dailycash_key.p12 || { echo "Key decode failed"; exit 1; }

      - name: Build signed release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DailyCash-KeyGen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DailyCash-KeyGen-APK
          path: DailyCash-KeyGen.apk
          if-no-files-found: error

      - name: Publish release (download the APK directly from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keygen-v${{ github.run_number }}
          name: DailyCash KeyGen v${{ github.run_number }}
          files: DailyCash-KeyGen.apk
